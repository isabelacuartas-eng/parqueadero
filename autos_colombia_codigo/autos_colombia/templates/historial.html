{% extends "base.html" %}{% block contenido %}
<h1>Historial de movimientos</h1><div class="card"><table><tr><th>Placa</th><th>Celda</th><th>Entrada</th><th>Salida</th></tr>
{% for f in filas %}<tr><td>{{ f.placa }}</td><td>{{ f.codigo }}</td><td>{{ f.fecha_entrada|fecha }}</td><td>{{ f.fecha_salida|fecha }}</td></tr>
{% else %}<tr><td colspan="4">Sin movimientos.</td></tr>{% endfor %}</table></div>{% endblock %}
